<svg viewBox="0 0 1000 1400" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="18%" r="75%">
      <stop offset="0%" stop-color="#1E2732" />
      <stop offset="45%" stop-color="#0C1118" />
      <stop offset="100%" stop-color="#020304" />
    </radialGradient>

    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2FD9CB" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#2FD9CB" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#2FD9CB" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#B9F3EE" />
    </linearGradient>

    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2FD9CB" stop-opacity="0" />
      <stop offset="50%" stop-color="#2FD9CB" stop-opacity="1" />
      <stop offset="100%" stop-color="#2FD9CB" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- fond -->
  <rect width="1000" height="1400" fill="url(#bgGlow)" />

  <!-- halo circulaire derrière le titre -->
  <circle cx="500" cy="430" r="360" fill="url(#ringGlow)" />

  <!-- arcs concentriques type aurore -->
  <g fill="none" stroke="#2FD9CB">
    <circle cx="500" cy="430" r="190" stroke-opacity="0.55" stroke-width="1.5" />
    <circle cx="500" cy="430" r="240" stroke-opacity="0.35" stroke-width="1" />
    <circle cx="500" cy="430" r="300" stroke-opacity="0.2" stroke-width="1" />
    <circle cx="500" cy="430" r="360" stroke-opacity="0.1" stroke-width="1" />
  </g>
  <g fill="none" stroke="#E8FFFC" stroke-opacity="0.5">
    <path d="M 260 250 A 300 300 0 0 1 740 250" stroke-width="2" />
    <path d="M 230 300 A 340 340 0 0 1 770 300" stroke-width="1" stroke-opacity="0.3" />
  </g>

  <!-- cadre + graduations -->
  <rect x="48" y="48" width="904" height="1304" fill="none" stroke="#3A4353" stroke-width="1" />
  <g stroke="#4A5567" stroke-width="1">
    <line x1="48" y1="80" x2="70" y2="80" />
    <line x1="952" y1="80" x2="930" y2="80" />
    <line x1="48" y1="1320" x2="70" y2="1320" />
    <line x1="952" y1="1320" x2="930" y2="1320" />
  </g>

  <!-- monogramme en haut à gauche -->
  <g transform="translate(88,96)">
    <circle cx="14" cy="14" r="13" fill="none" stroke="#2FD9CB" stroke-width="1.5" />
    <circle cx="14" cy="14" r="4" fill="#2FD9CB" />
    <text x="38" y="19" fill="#B7C0CC" font-size="15" letter-spacing="3">AURORA NIGHTS</text>
  </g>
  <text x="912" y="110" fill="#6B7684" font-size="14" letter-spacing="2" text-anchor="end">SÉRIE 07</text>

  <!-- titre principal -->
  <text x="500" y="470" fill="url(#titleGrad)" font-size="168" font-weight="800" letter-spacing="4" text-anchor="middle">AURORA</text>
  <text x="500" y="540" fill="#8FE8E0" font-size="34" font-weight="500" letter-spacing="14" text-anchor="middle">NIGHTS</text>

  <!-- barre décorative -->
  <rect x="300" y="590" width="400" height="2" fill="url(#barGrad)" />

  <text x="500" y="640" fill="#A9B2BE" font-size="17" letter-spacing="1" text-anchor="middle">
    UNE NUIT DE MUSIQUE ÉLECTRONIQUE ET D'ART VISUEL
  </text>

  <!-- bloc visuel bas : ondes stylisées -->
  <g transform="translate(500,880)" fill="none" stroke="#2FD9CB">
    <path d="M -380 0 Q -320 -70 -260 0 T -140 0 T -20 0 T 100 0 T 220 0 T 340 0 T 380 0" stroke-width="2" stroke-opacity="0.85" />
    <path d="M -380 40 Q -320 -20 -260 40 T -140 40 T -20 40 T 100 40 T 220 40 T 340 40 T 380 40" stroke-width="1.3" stroke-opacity="0.45" />
    <path d="M -380 -40 Q -320 30 -260 -40 T -140 -40 T -20 -40 T 100 -40 T 220 -40 T 340 -40 T 380 -40" stroke-width="1" stroke-opacity="0.25" />
  </g>

  <!-- pied d'affiche : infos -->
  <g fill="#D7DCE3" font-size="20" letter-spacing="1">
    <text x="88" y="1220">14 NOV</text>
    <text x="88" y="1248" fill="#6B7684" font-size="14" letter-spacing="1.5">SAMEDI · DOORS 22:00</text>

    <text x="500" y="1220" text-anchor="middle">WAREHOUSE 7</text>
    <text x="500" y="1248" fill="#6B7684" font-size="14" letter-spacing="1.5" text-anchor="middle">QUARTIER DES DOCKS</text>

    <text x="912" y="1220" text-anchor="end">BILLETS</text>
    <text x="912" y="1248" fill="#6B7684" font-size="14" letter-spacing="1.5" text-anchor="end">AURORANIGHTS.CO</text>
  </g>

  <rect x="88" y="1272" width="824" height="1" fill="#3A4353" />

  <!-- code-barres décoratif -->
  <g transform="translate(88,1296)" fill="#5B6472">
    <rect x="0" y="0" width="2" height="26" />
    <rect x="5" y="0" width="1" height="26" />
    <rect x="9" y="0" width="3" height="26" />
    <rect x="15" y="0" width="1" height="26" />
    <rect x="19" y="0" width="2" height="26" />
    <rect x="24" y="0" width="1" height="26" />
    <rect x="28" y="0" width="4" height="26" />
    <rect x="35" y="0" width="1" height="26" />
    <rect x="39" y="0" width="2" height="26" />
    <rect x="44" y="0" width="1" height="26" />
    <rect x="48" y="0" width="3" height="26" />
  </g>
  <text x="912" y="1316" fill="#6B7684" font-size="13" letter-spacing="1" text-anchor="end">ÉDITION LIMITÉE — N° 0142</text>
</svg>
